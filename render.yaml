services:
  - type: web
    name: yaan-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # Options: oregon, frankfurt, singapore, ohio
    envVars:
      # NOTE: Production secrets are NOT stored in this file.
      # Every variable with `sync: false` must be set in the Render Dashboard -> yaan-backend -> Environment.
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://yaan-backend.onrender.com
      - key: APP_FRONTEND_URL
        value: https://yaan-backend.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_URL
        sync: false
      - key: RUN_MIGRATIONS
        value: "true"

      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Yaan

      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: ADMIN_EMAIL
        value: admin@yaan.com
      - key: ADMIN_PASSWORD
        sync: false

      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase-credentials.json
      - key: FIREBASE_PROJECT_ID
        value: yaan-12663

      - key: GOOGLE_MAPS_API_KEY
        sync: false
